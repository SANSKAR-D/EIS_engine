[project]
name = "email-intel-system"
version = "0.1.0"
description = "AI-Powered Official Email Intelligence System: Dual-Plane Event-Sourced Core + FastMCP Tool Boundary + LangGraph Self-Correction Shell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "google-genai>=3.6.1",
    "fastmcp>=2.10.0",
    "langgraph>=0.3.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
